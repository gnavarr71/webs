<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Gesture Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        /* Container for video and canvas */
        #container { position: relative; width: 100vw; height: 100vh; }

        /* Video: Hidden visually, processed by JS. Mirrored for natural feel */
        #input_video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transform: scaleX(-1); opacity: 0; z-index: 0;
        }

        /* Canvas: Where the AR game lives */
        #output_canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; transform: scaleX(-1); /* Mirror to match video */
        }

        /* UI Overlay (Score, etc) - Not mirrored */
        #ui_layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        #score_board {
            position: absolute; top: 20px; left: 20px;
            color: #00ffcc; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* Loading Screen */
        #loading_screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; z-index: 10; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            transition: opacity 0.5s;
        }
        .loader {
            border: 5px solid #333; border-top: 5px solid #00ffcc;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <!-- MediaPipe Hands - HARD LOCKED VERSION -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js"></script>
</head>
<body>

    <div id="loading_screen">
        <div class="loader"></div>
        <div id="loading_text">Initializing Neural Network...</div>
    </div>

    <div id="container">
        <video id="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="ui_layer">
            <div id="score_board">SCORE: 0</div>
        </div>
    </div>

<script>
/**
 * 1. GAME ENGINE & STATE
 */
const state = {
    score: 0,
    handDetected: false,
    rawHandPos: { x: 0.5, y: 0.5 }, // 0-1 range
    aimPos: { x: 0, y: 0 },         // 2D Screen Coords
    isTriggerClosed: false,
    wasTriggerClosed: false,
    magneticFactor: 0.0,            // 0 = none, 1 = locked
    lastShotTime: 0
};

// Config
const ENEMY_COUNT = 4;
const MAGNET_RADIUS = 100; // Pixels
const TRIGGER_THRESHOLD = 0.06; // Distance between thumb and index base

// Three.js Globals
let camera, scene, renderer, videoTexture;
let enemies = [];
let floatingTexts = [];
let laserLine;
let crosshairMesh;

/**
 * 2. AUDIO SYNTHESIS (No assets needed)
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    
    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

/**
 * 3. THREE.JS SETUP
 */
function initThree() {
    const canvas = document.getElementById('output_canvas');
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Camera matches screen
    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.z = 10;

    scene = new THREE.Scene();

    // Video Background
    const video = document.getElementById('input_video');
    videoTexture = new THREE.VideoTexture(video);
    scene.background = videoTexture;

    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    // Crosshair
    const chGeo = new THREE.RingGeometry(0.15, 0.2, 32);
    const chMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.8 });
    crosshairMesh = new THREE.Mesh(chGeo, chMat);
    scene.add(crosshairMesh);

    // Laser Line
    const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
    const laserMat = new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 2 });
    laserLine = new THREE.Line(laserGeo, laserMat);
    scene.add(laserLine);

    // Initialize Enemies
    for(let i=0; i<ENEMY_COUNT; i++) spawnEnemy();
}

function spawnEnemy() {
    const geometry = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16);
    geometry.rotateX(Math.PI / 2); // Face camera
    const material = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff, shininess: 100 });
    const mesh = new THREE.Mesh(geometry, material);

    // Random edge spawn
    const edge = Math.floor(Math.random() * 4);
    const spread = 15;
    const depth = 5;
    
    if(edge === 0) mesh.position.set(-spread, (Math.random()-0.5)*10, -depth); // Left
    if(edge === 1) mesh.position.set(spread, (Math.random()-0.5)*10, -depth); // Right
    if(edge === 2) mesh.position.set((Math.random()-0.5)*20, spread, -depth); // Top
    if(edge === 3) mesh.position.set((Math.random()-0.5)*20, -spread, -depth); // Bottom

    // Metadata
    mesh.userData = {
        velocity: new THREE.Vector3(0,0,0).sub(mesh.position).normalize().multiplyScalar(0.05 + Math.random() * 0.05),
        active: true
    };
    
    scene.add(mesh);
    enemies.push(mesh);
}

function createFloatingText(text, pos, isHit) {
    const div = document.createElement('div');
    div.innerText = text;
    div.style.position = 'absolute';
    div.style.color = isHit ? '#ffff00' : '#888';
    div.style.fontWeight = 'bold';
    div.style.fontSize = '24px';
    div.style.pointerEvents = 'none';
    div.style.textShadow = '0 0 5px #000';
    div.style.transition = 'transform 1s, opacity 1s';
    
    // Project 3D pos to 2D
    const vec = pos.clone().project(camera);
    const x = (vec.x * .5 + .5) * window.innerWidth;
    const y = (-(vec.y * .5) + .5) * window.innerHeight;
    
    div.style.left = `${x}px`;
    div.style.top = `${y}px`;
    
    document.body.appendChild(div);

    // Animate
    requestAnimationFrame(() => {
        div.style.transform = `translateY(-50px)`;
        div.style.opacity = '0';
    });

    setTimeout(() => div.remove(), 1000);
}

/**
 * 4. GAME LOGIC LOOP (runs at 60fps)
 */
function updateGame() {
    // 1. Move Enemies
    enemies.forEach((enemy, index) => {
        if(!enemy.userData.active) return;
        
        enemy.position.add(enemy.userData.velocity);
        enemy.rotation.z += 0.05;

        // Reset if too close or too far
        if(enemy.position.z > 12 || enemy.position.length() > 25) {
            scene.remove(enemy);
            enemies.splice(index, 1);
            spawnEnemy();
        }
    });

    // 2. Process Hand Aim & Magnetism
    if (state.handDetected) {
        // Convert normalized hand pos to screen pixels
        const screenX = state.rawHandPos.x * window.innerWidth;
        const screenY = state.rawHandPos.y * window.innerHeight;

        // Calculate Raycaster from Camera based on Hand Pos
        // Note: rawHandPos is 0-1. Three.js needs -1 to 1.
        const ndcX = (state.rawHandPos.x * 2) - 1;
        const ndcY = -(state.rawHandPos.y * 2) + 1;

        // --- MAGNETIC AIM ASSIST ---
        let closestDist = 9999;
        let targetPos = null;

        enemies.forEach(enemy => {
            // Project enemy to 2D screen space
            const p = enemy.position.clone().project(camera);
            const ex = (p.x * .5 + .5) * window.innerWidth;
            const ey = (-(p.y * .5) + .5) * window.innerHeight;
            
            const dx = ex - screenX;
            const dy = ey - screenY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < MAGNET_RADIUS && dist < closestDist) {
                closestDist = dist;
                targetPos = enemy.position.clone();
                state.magneticFactor = Math.min(state.magneticFactor + 0.1, 1.0);
            }
        });

        // Decay magnet if no target
        if (!targetPos) state.magneticFactor = Math.max(state.magneticFactor - 0.1, 0.0);

        // Update Crosshair Position (Lerp between raw hand and magnet target)
        // We position the crosshair in 3D space at a fixed depth
        const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
        vector.unproject(camera);
        const dir = vector.sub(camera.position).normalize();
        const distance = 8; // Crosshair distance
        let finalPos = camera.position.clone().add(dir.multiplyScalar(distance));

        if (targetPos && state.magneticFactor > 0.5) {
            // Visual Snap
            crosshairMesh.material.color.setHex(0xff0000);
            const snapDir = targetPos.clone().sub(camera.position).normalize();
            const snapPos = camera.position.clone().add(snapDir.multiplyScalar(distance));
            finalPos.lerp(snapPos, 0.5); // Snap effect
        } else {
            crosshairMesh.material.color.setHex(0x00ffcc);
        }

        crosshairMesh.position.copy(finalPos);
        crosshairMesh.lookAt(camera.position);

        // Update Laser
        // Origin roughly bottom center or hand estimation
        const laserStart = new THREE.Vector3(finalPos.x * 0.5, finalPos.y - 3, 2); 
        laserLine.geometry.setFromPoints([laserStart, finalPos]);

        // 3. SHOOTING LOGIC
        if (state.isTriggerClosed && !state.wasTriggerClosed) {
            shoot(finalPos);
        }
        state.wasTriggerClosed = state.isTriggerClosed;
    } else {
        // Hide UI if no hand
        crosshairMesh.position.set(0,0,100); 
    }

    renderer.render(scene, camera);
    requestAnimationFrame(updateGame);
}

function shoot(aimPos3D) {
    playSound('shoot');
    
    // Raycast logic from camera to aimPos
    const raycaster = new THREE.Raycaster();
    const direction = aimPos3D.clone().sub(camera.position).normalize();
    raycaster.set(camera.position, direction);

    const intersects = raycaster.intersectObjects(enemies);

    if (intersects.length > 0) {
        const hitObj = intersects[0].object;
        createFloatingText("HIT!", hitObj.position, true);
        playSound('hit');
        
        // Destroy Enemy
        scene.remove(hitObj);
        enemies = enemies.filter(e => e !== hitObj);
        
        // VFX: Simple expansion before delete (visual trick)
        // (In a full engine we'd use particle systems)
        
        state.score += 100;
        document.getElementById('score_board').innerText = "SCORE: " + state.score;
        spawnEnemy();
    } else {
        // Visual 'Miss' at the crosshair depth
        createFloatingText("MISS", aimPos3D, false);
    }
}

/**
 * 5. MEDIAPIPE HANDS SETUP (The Anti-Crash Safe Version)
 */
async function initMediaPipe() {
    const videoElement = document.getElementById('input_video');
    
    // SAFETY: Use the specific constrained version URL for locateFile
    const hands = new Hands({locateFile: (file) => {
        return `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1, // 0 is faster, 1 is accurate
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    // Initialize Camera
    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            try {
                // Throttle detection slightly to keep rendering smooth if device is slow
                await hands.send({image: videoElement});
            } catch (e) {
                console.error("MP Error:", e);
            }
        },
        width: 1280,
        height: 720
    });

    // Start everything
    await cameraUtils.start();
    
    // Hide loading when we get rolling
    document.getElementById('loading_text').innerText = "Ready!";
    setTimeout(() => {
        document.getElementById('loading_screen').style.opacity = 0;
        setTimeout(() => document.getElementById('loading_screen').style.display = 'none', 500);
    }, 1000);
}

/**
 * 6. GESTURE RECOGNITION
 */
function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        state.handDetected = true;

        // 1. Aiming: Index Finger Tip (8)
        const indexTip = landmarks[8];
        state.rawHandPos = { x: indexTip.x, y: indexTip.y };

        // 2. Trigger: Distance between Thumb Tip (4) and Index Base/PIP (6)
        // 4 = Thumb Tip, 6 = Index PIP (Knuckle mid-finger)
        // Using landmarks directly (z is depth relative to wrist)
        const thumbTip = landmarks[4];
        const indexPip = landmarks[6]; // Using PIP is more stable for "pistol" curl

        // Simple Euclidean distance in normalized coords (approximate)
        const dx = thumbTip.x - indexPip.x;
        const dy = thumbTip.y - indexPip.y;
        // Correct aspect ratio for distance calculation
        const aspect = window.innerWidth / window.innerHeight;
        const dist = Math.sqrt((dx * dx) + (dy * aspect * dy * aspect));

        // State Machine for Trigger
        if (dist < TRIGGER_THRESHOLD) {
            state.isTriggerClosed = true;
        } else if (dist > TRIGGER_THRESHOLD * 1.5) {
            // Hysteresis to prevent flickering
            state.isTriggerClosed = false;
        }

    } else {
        state.handDetected = false;
        state.isTriggerClosed = false;
    }
}

// Window Resize Handling
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Boot Sequence
window.onload = () => {
    initThree();
    initMediaPipe();
    updateGame(); // Start Render Loop
};

</script>
</body>
</html>
